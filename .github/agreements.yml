# The agreements that contributors sign on https://sign.pycal.org before their pull
# requests are labelled. The format: https://docs.sign.pycal.org/reference/config-file.html
version: 2.1.0
agreements:
  ai-policy:
    name: AI Policy (example)
    description: Use AI responsibly and disclose assistance.
    mandatory: false
    # a tag, a branch or a commit; a tag keeps the agreement stable
    ref: main
    repository: https://github.com/PyCalendar/ai.pycal.org-example.git
    path: agreements/ai-policy.md
    pr:
      labels: ai-policy-accepted
  cla:
    name: Contributor License Agreement (example)
    description: Give the project permission to distribute your contributions.
    mandatory: true
    ref: main
    repository: git@github.com:PyCalendar/ai.pycal.org-example.git
    path: agreements/cla.md
    pr:
      # while the agreement is not signed, since version 2.1.0
      unsigned-labels: cla-missing
      labels:
        - cla-signed
